spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vuatho?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}

  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    expose-in-response: ${OTP_EXPOSE_IN_RESPONSE:true}

  cloudinary:
    url: ${CLOUDINARY_URL}

  goong:
    api-key: ${GOONG_API_KEY}

  admin:
    email: ${ADMIN_EMAIL:admin@vuatho.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    full-name: Administrator

logging:
  level:
    org.springframework.security: INFO