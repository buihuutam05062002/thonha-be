# Mọi secret/khóa API đọc từ biến môi trường - xem .env.example
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vuatho?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # Schema do db/migration quản lý; Hibernate chỉ kiểm tra entity khớp schema
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}

  cloudinary:
    url: ${CLOUDINARY_URL:}

  # GOONG_API_KEY: khóa REST (tìm địa chỉ, tính khoảng cách) - chỉ dùng ở backend
  goong:
    api-key: ${GOONG_API_KEY:}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-latest}
    fallback-models: ${GEMINI_FALLBACK_MODELS:}   # tên các model cách nhau bằng dấu phẩy
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-seconds: 15
    min-confidence: 0.5

  admin:
    email: ${ADMIN_EMAIL:admin@vuatho.com}
    password: ${ADMIN_PASSWORD:}
    full-name: Administrator
    phone: ${ADMIN_PHONE:0900000000}

logging:
  level:
    org.springframework.security: INFO
